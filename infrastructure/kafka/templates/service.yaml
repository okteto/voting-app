apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: kafka
    protocol: TCP
    name: kafka
  - port: {{ .Values.service.externalPort }}
    targetPort: kafka-external
    protocol: TCP
    name: kafka-external
  selector:
    app: kafka