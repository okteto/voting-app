image:
  repository: postgres
  tag: "15-alpine"
  pullPolicy: IfNotPresent

database:
  name: votes
  user: okteto
  password: okteto

service:
  type: ClusterIP
  port: 5432

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

persistence:
  enabled: true
  size: 8Gi
  storageClass: ""