apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  labels:
    app: zookeeper
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: client
    protocol: TCP
    name: client
  - port: 2888
    targetPort: server
    protocol: TCP
    name: server
  - port: 3888
    targetPort: leader-election
    protocol: TCP
    name: leader-election
  selector:
    app: zookeeper