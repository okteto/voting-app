name: voting-app
deploy:
  compose: docker-compose.yml
dev:
  vote:
    image: ${OKTETO_BUILD_VOTE_IMAGE}
    command: bash
    sync:
      - ./vote:/app
    forward:
      - 8080:8080
      - 5005:5005
  result:
    image: ${OKTETO_BUILD_RESULT_IMAGE}  
    command: bash
    sync:
      - ./result:/app
    forward:
      - 4000:4000
  worker:
    image: ${OKTETO_BUILD_WORKER_IMAGE}
    command: bash
    sync:
      - ./worker:/app
    forward:
      - 2345:2345